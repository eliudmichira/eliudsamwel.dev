    <style>
        /* Enhanced Firebase Studio Theme Variables */
        :root {
            /* Dark Mode */
            --primary-bg: #0a0a0a;
            --secondary-bg: #111111;
            --card-bg: #1a1a1a; 
            --input-bg: #262626;
            --primary-text: #ffffff;
            --secondary-text: #888888; 
            --accent-color: #ffca28; 
            --accent-color-amber: #ffa000; 
            --accent-color-red: #f57c00; 
            --accent-gradient: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-color-amber) 50%, var(--accent-color-red) 100%);
            --text-gradient: linear-gradient(135deg, var(--accent-color), var(--accent-color-red)); 
            --card-border: #2a2a2a; 
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --glow: 0 0 30px rgba(255, 202, 40, 0.3);
            --card-glow: 0 0 50px rgba(255, 130, 27, 0.15);
            --dot-glow: 0 0 25px rgba(255, 202, 40, 0.6);
            --glow-bg: 
                radial-gradient(circle at 20% 80%, rgba(255, 202, 40, 0.15), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(245, 124, 0, 0.15), transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 160, 0, 0.1), transparent 50%);
            
            /* Light Mode */
            --light-primary-bg: #fafafa; 
            --light-secondary-bg: #f5f5f5; 
            --light-card-bg: #ffffff;
            --light-input-bg: #f8f9fa; 
            --light-primary-text: #1a1a1a; 
            --light-secondary-text: #666666; 
            --light-card-border: #e5e5e5; 
            --light-card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --light-glow: 0 0 30px rgba(255, 160, 0, 0.2);
            --light-card-glow: 0 0 50px rgba(255, 130, 27, 0.1);
            --light-dot-glow: 0 0 25px rgba(255, 160, 0, 0.4);
            --light-glow-bg: 
                radial-gradient(circle at 20% 80%, rgba(255, 202, 40, 0.08), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(245, 124, 0, 0.08), transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 160, 0, 0.05), transparent 50%);
            
            --border-radius: 1rem; 
            --border-radius-lg: 1.5rem; 
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --hover-scale: 1.03;
            --hover-lift: -8px;
            --blur-amount: 10px; /* Adjusted from 20px for subtlety */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
        html.dark { color-scheme: dark; }
        html.light { color-scheme: light; }

        body {
            line-height: 1.6;
            background-color: var(--primary-bg);
            color: var(--primary-text);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
            cursor: none; /* For custom cursor */
        }
        
        html.dark body {
             background-image: var(--glow-bg);
        }
        html.light body {
            background-color: var(--primary-bg);
            color: var(--primary-text);
            background-image: var(--glow-bg);
        }

        /* Enhanced Custom Scrollbar from contact.html */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: var(--primary-bg); border-radius: 7px; }
        html.light ::-webkit-scrollbar-track { background: var(--primary-bg); }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gradient);
            border-radius: 7px;
            border: 2px solid var(--primary-bg); /* Match track for seamless look */
            box-shadow: inset 0 0 10px rgba(0,0,0, 0.2); /* Subtle inset shadow for depth */
        }
        html.light ::-webkit-scrollbar-thumb {
            border: 2px solid var(--primary-bg);
        }
        ::-webkit-scrollbar-thumb:hover {
             filter: brightness(1.15);
        }


        /* Preloader Styles */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-bg); 
            z-index: 99999; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease; /* Added visibility transition */
            visibility: visible;
        }
        html.light #preloader {
            background: var(--primary-bg);
        }
        #preloader.loaded { /* Class to hide preloader */
            opacity: 0;
            visibility: hidden;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid transparent;
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        }
        .loader::before {
            content: '';
            position: absolute;
            inset: -8px; 
            border: 4px solid transparent;
            border-bottom-color: var(--accent-color-red);
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes customPulse { 
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.3); opacity: 0.1; }
        }
        @keyframes float { 
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); }
        }
         .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .delay-100 { animation-delay: 0.1s !important; }
        .delay-200 { animation-delay: 0.2s !important; }
        .delay-300 { animation-delay: 0.3s !important; }
        .delay-400 { animation-delay: 0.4s !important; }
        .delay-500 { animation-delay: 0.5s !important; }

        .gradient-text {
            background: var(--text-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block; 
        }

        /* Scroll Progress Indicator from contact.html */
        #scroll-progress-indicator {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px; /* Matched contact.html */
            background: rgba(255, 202, 40, 0.2); /* Directly using color from contact.html */
            z-index: 1000; /* Matched contact.html */
        }
        #scroll-progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.1s ease; /* Matched contact.html */
            box-shadow: 0 0 10px rgba(255, 202, 40, 0.5); /* Matched contact.html */
        }
        
        /* Custom Cursor from contact.html */
        #cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-gradient);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 100001; /* Ensure on top */
            mix-blend-mode: difference;
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.2s ease; /* Faster response */
            opacity: 0; /* Initially hidden, made visible by JS */
            box-shadow: 0 0 20px var(--accent-color), 0 0 40px var(--accent-color);
        }
        #cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 100000; /* Ensure on top */
            transition: all 0.08s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.2s ease; /* Much faster response */
            opacity: 0; /* Initially hidden, made visible by JS */
            backdrop-filter: blur(2px);
        }
        #cursor-outline.hover {
            transform: scale(1.8);
            opacity: 1 !important; /* Ensure visible when hover class is active */
            border-color: var(--primary-amber);
            box-shadow: 0 0 30px var(--primary-amber), 0 0 60px var(--primary-amber);
            animation: cursor-pulse 0.6s ease-in-out;
        }
        #cursor-outline.click {
            transform: scale(0.8);
            border-width: 4px;
            border-color: var(--primary-orange);
        }
        
        /* Cursor Trail Effect */
        .cursor-trail {
            width: 4px;
            height: 4px;
            background: var(--accent-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            opacity: 0.6;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 0 10px var(--accent-color);
        }
        
        /* Cursor Ripple Effect */
        .cursor-ripple {
            position: fixed;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            animation: cursor-ripple-animation 0.6s ease-out forwards;
        }
        
        /* Enhanced Cursor Animations */
        @keyframes cursor-pulse {
            0% { transform: scale(1.8); }
            50% { transform: scale(2.2); }
            100% { transform: scale(1.8); }
        }
        
        @keyframes cursor-ripple-animation {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 0;
            }
        }
        
        @keyframes cursor-magnetic {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes cursor-text-bounce {
            0% { transform: translateY(-30px) scale(0.8); opacity: 0; }
            50% { transform: translateY(-35px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-30px) scale(1); opacity: 1; }
        }
        
        /* Magnetic effect for special elements */
        .magnetic {
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .magnetic:hover {
            transform: translateY(-2px);
        }
        
        /* Special cursor states for different elements */
        #cursor-outline.text-cursor {
            width: 20px;
            height: 2px;
            border-radius: 1px;
            border-color: var(--primary-amber);
            transform-origin: center;
        }
        
        #cursor-outline.loading-cursor {
            animation: cursor-spin 1s linear infinite;
        }
        
        @keyframes cursor-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
                 #cursor-text.show {
             animation: cursor-text-bounce 0.4s ease-out;
         }
         
         /* Text Cursor Effect */
         #cursor-text {
             position: fixed;
             pointer-events: none;
             z-index: 100002;
             color: var(--accent-color);
             font-size: 12px;
             font-weight: 600;
             opacity: 0;
             transition: all 0.3s ease;
             transform: translateY(-30px);
             text-shadow: 0 0 10px var(--accent-color);
         }
        
        body.cursor-ready #cursor-dot,
        body.cursor-ready #cursor-outline {
            opacity: 0.8; /* Increased default visibility */
        }
        html.light body.cursor-ready #cursor-dot {
            mix-blend-mode: multiply; /* Better visibility on light mode */
            background: var(--accent-color); /* Ensure dot is visible on light bg */
            box-shadow: 0 0 15px var(--accent-color);
        }
        html.light body.cursor-ready #cursor-outline {
            opacity: 0.9;
            backdrop-filter: blur(1px);
        }


    </style>

<script>
  // Theme initialization script - runs before page renders
  (function() {
    // Check for saved theme preference or use device preference
    const savedTheme = localStorage.getItem('theme');
    const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    // Apply theme
    if (savedTheme === 'dark' || (!savedTheme && userPrefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.add('light');
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
