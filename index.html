<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliud Samwel - Portfolio</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/theme.css">
    <script src="https://cdn.tailwindcss.com"></script> <!-- Using existing Tailwind v3 setup -->
    <script src="scripts/tailwind-theme.js" type="module"></script>
    <script src="scripts/themeToggle.js" type="module" defer></script>
    <style>
        /* Enhanced Firebase Studio Theme Variables */
        :root {
            /* Dark Mode */
            --primary-bg: #0a0a0a;
            --secondary-bg: #111111;
            --card-bg: #1a1a1a; 
            --input-bg: #262626;
            --primary-text: #ffffff;
            --secondary-text: #888888; 
            --accent-color: #ffca28; 
            --accent-color-amber: #ffa000; 
            --accent-color-red: #f57c00; 
            --accent-gradient: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-color-amber) 50%, var(--accent-color-red) 100%);
            --text-gradient: linear-gradient(135deg, var(--accent-color), var(--accent-color-red)); 
            --card-border: #2a2a2a; 
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            --glow: 0 0 30px rgba(255, 202, 40, 0.3);
            --card-glow: 0 0 50px rgba(255, 130, 27, 0.15);
            --dot-glow: 0 0 25px rgba(255, 202, 40, 0.6);
            --glow-bg: 
                radial-gradient(circle at 20% 80%, rgba(255, 202, 40, 0.15), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(245, 124, 0, 0.15), transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 160, 0, 0.1), transparent 50%);
            
            /* Light Mode */
            --light-primary-bg: #fafafa; 
            --light-secondary-bg: #f5f5f5; 
            --light-card-bg: #ffffff;
            --light-input-bg: #f8f9fa; 
            --light-primary-text: #1a1a1a; 
            --light-secondary-text: #666666; 
            --light-card-border: #e5e5e5; 
            --light-card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --light-glow: 0 0 30px rgba(255, 160, 0, 0.2);
            --light-card-glow: 0 0 50px rgba(255, 130, 27, 0.1);
            --light-dot-glow: 0 0 25px rgba(255, 160, 0, 0.4);
            --light-glow-bg: 
                radial-gradient(circle at 20% 80%, rgba(255, 202, 40, 0.08), transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(245, 124, 0, 0.08), transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 160, 0, 0.05), transparent 50%);
            
            --border-radius: 1rem; 
            --border-radius-lg: 1.5rem; 
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --hover-scale: 1.03;
            --hover-lift: -8px;
            --blur-amount: 10px; /* Adjusted from 20px for subtlety */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
        html.dark { color-scheme: dark; }
        html.light { color-scheme: light; }

        body {
            line-height: 1.6;
            background-color: var(--primary-bg);
            color: var(--primary-text);
            transition: var(--transition);
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
            cursor: none; /* For custom cursor */
        }
        
        html.dark body {
             background-image: var(--glow-bg);
        }
        html.light body {
            background-color: var(--primary-bg);
            color: var(--primary-text);
            background-image: var(--glow-bg);
        }

        /* Enhanced Custom Scrollbar from contact.html */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: var(--primary-bg); border-radius: 7px; }
        html.light ::-webkit-scrollbar-track { background: var(--primary-bg); }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-gradient);
            border-radius: 7px;
            border: 2px solid var(--primary-bg); /* Match track for seamless look */
            box-shadow: inset 0 0 10px rgba(0,0,0, 0.2); /* Subtle inset shadow for depth */
        }
        html.light ::-webkit-scrollbar-thumb {
            border: 2px solid var(--primary-bg);
        }
        ::-webkit-scrollbar-thumb:hover {
             filter: brightness(1.15);
        }


        /* Preloader Styles */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-bg); 
            z-index: 99999; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease; /* Added visibility transition */
            visibility: visible;
        }
        html.light #preloader {
            background: var(--primary-bg);
        }
        #preloader.loaded { /* Class to hide preloader */
            opacity: 0;
            visibility: hidden;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid transparent;
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        }
        .loader::before {
            content: '';
            position: absolute;
            inset: -8px; 
            border: 4px solid transparent;
            border-bottom-color: var(--accent-color-red);
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes customPulse { 
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.3); opacity: 0.1; }
        }
        @keyframes float { 
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); }
        }
         .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        .delay-100 { animation-delay: 0.1s !important; }
        .delay-200 { animation-delay: 0.2s !important; }
        .delay-300 { animation-delay: 0.3s !important; }
        .delay-400 { animation-delay: 0.4s !important; }
        .delay-500 { animation-delay: 0.5s !important; }

        .gradient-text {
            background: var(--text-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block; 
        }

        /* Scroll Progress Indicator from contact.html */
        #scroll-progress-indicator {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px; /* Matched contact.html */
            background: rgba(255, 202, 40, 0.2); /* Directly using color from contact.html */
            z-index: 1000; /* Matched contact.html */
        }
        #scroll-progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.1s ease; /* Matched contact.html */
            box-shadow: 0 0 10px rgba(255, 202, 40, 0.5); /* Matched contact.html */
        }
        
        /* Custom Cursor from contact.html */
        #cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-gradient);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 100001; /* Ensure on top */
            mix-blend-mode: difference;
            transition: transform 0.2s ease, opacity 0.2s ease; /* Added opacity transition */
            opacity: 0; /* Initially hidden, made visible by JS */
        }
        #cursor-outline {
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 100000; /* Ensure on top */
            transition: all 0.15s ease, opacity 0.2s ease; /* Added opacity transition */
            opacity: 0; /* Initially hidden, made visible by JS */
        }
        #cursor-outline.hover {
            transform: scale(1.5);
            opacity: 1 !important; /* Ensure visible when hover class is active */
        }
        body.cursor-ready #cursor-dot,
        body.cursor-ready #cursor-outline {
            opacity: 0.5; /* Default visible state */
        }
        html.light body.cursor-ready #cursor-dot {
            mix-blend-mode: normal; /* May need adjustment for light mode visibility */
            background: var(--accent-color); /* Ensure dot is visible on light bg */
        }
        html.light body.cursor-ready #cursor-outline {
            opacity: 0.7;
        }


    </style>
    <!-- Eclipse theme toggle is defined in the theme.css file -->
    <style>
        /* Hide the old theme icons */
        .theme-icons {
            display: none;
        }
    </style>
<script>
  // Theme initialization script - runs before page renders
  (function() {
    // Check for saved theme preference or use device preference
    const savedTheme = localStorage.getItem('theme');
    const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    // Apply theme
    if (savedTheme === 'dark' || (!savedTheme && userPrefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.add('light');
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
</head>

    <div id="preloader">
        <div class="loader"></div>
    </div>

    <div id="scroll-progress-indicator">
        <div id="scroll-progress-bar"></div>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div id="root"></div>
